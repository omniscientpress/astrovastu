<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Divine Jyothi logo">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a2466"/>
      <stop offset="55%" stop-color="#15123a"/>
      <stop offset="100%" stop-color="#07060f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="45%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#a67c0a"/>
    </linearGradient>
    <linearGradient id="lotusFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3d348b"/>
      <stop offset="100%" stop-color="#1a1545"/>
    </linearGradient>
  </defs>

  <!-- Outer circle + compass points -->
  <circle cx="256" cy="256" r="248" fill="url(#sky)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.7"/>

  <!-- Cardinal tips -->
  <polygon points="256,8 268,36 256,30 244,36" fill="url(#gold)"/>
  <polygon points="504,256 476,268 482,256 476,244" fill="url(#gold)"/>
  <polygon points="256,504 244,476 256,482 268,476" fill="url(#gold)"/>
  <polygon points="8,256 36,244 30,256 36,268" fill="url(#gold)"/>

  <!-- Stars / sparkles -->
  <g fill="#f0d78c" opacity="0.85">
    <circle cx="120" cy="150" r="1.5"/>
    <circle cx="390" cy="130" r="1.2"/>
    <circle cx="150" cy="360" r="1.4"/>
    <circle cx="380" cy="370" r="1.3"/>
    <circle cx="200" cy="110" r="1"/>
    <circle cx="330" cy="400" r="1.1"/>
    <circle cx="100" cy="260" r="1"/>
    <circle cx="420" cy="250" r="1.2"/>
  </g>

  <!-- Crescent moon (upper left) -->
  <path d="M150 175c18-28 52-40 80-30-28 8-48 34-46 64-22-4-38-18-34-34z" fill="url(#gold)"/>

  <!-- Ringed planet (upper right) -->
  <g transform="translate(360 155)">
    <ellipse cx="0" cy="0" rx="22" ry="6" fill="none" stroke="url(#gold)" stroke-width="2" transform="rotate(-25)"/>
    <circle cx="0" cy="0" r="9" fill="url(#gold)"/>
  </g>

  <!-- Numbers at cardinal points -->
  <g fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" text-anchor="middle">
    <text x="256" y="78">9</text>
    <text x="440" y="268">7</text>
    <text x="256" y="458">1</text>
    <text x="72" y="268">3</text>
  </g>

  <!-- Central 8-point star in ring -->
  <circle cx="256" cy="185" r="42" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <path d="M256 148 L264 175 L292 175 L270 192 L278 220 L256 204 L234 220 L242 192 L220 175 L248 175 Z
           M256 155 L260 172 L277 172 L263 182 L268 199 L256 190 L244 199 L249 182 L235 172 L252 172 Z"
        fill="url(#gold)"/>
  <!-- simpler bold star -->
  <path d="M256 152l8 24 26 0-20 15 7 25-21-15-21 15 7-25-20-15 26 0z" fill="url(#gold)"/>

  <!-- Infinity -->
  <path d="M210 255c-18 0-32 12-32 28s14 28 32 28c12 0 22-6 30-16 8 10 18 16 30 16 18 0 32-12 32-28s-14-28-32-28c-12 0-22 6-30 16-8-10-18-16-30-16z
           M210 267c8 0 16 5 22 16-6 11-14 16-22 16-10 0-18-7-18-16s8-16 18-16zm60 0c10 0 18 7 18 16s-8 16-18 16c-8 0-16-5-22-16 6-11 14-16 22-16z"
        fill="url(#gold)"/>

  <!-- Lotus -->
  <g transform="translate(256 340)">
    <path d="M0 -8 C-18 10 -28 28 -28 42 C-28 58 -16 68 0 68 C16 68 28 58 28 42 C28 28 18 10 0 -8Z" fill="url(#gold)"/>
    <path d="M-38 20 C-48 34 -50 50 -42 60 C-30 72 -12 66 -4 52 C-16 42 -28 30 -38 20Z" fill="url(#lotusFill)" stroke="url(#gold)" stroke-width="2"/>
    <path d="M38 20 C48 34 50 50 42 60 C30 72 12 66 4 52 C16 42 28 30 38 20Z" fill="url(#lotusFill)" stroke="url(#gold)" stroke-width="2"/>
    <path d="M-52 38 C-58 48 -56 60 -46 64 C-34 68 -22 58 -18 46 C-30 44 -42 40 -52 38Z" fill="url(#lotusFill)" stroke="url(#gold)" stroke-width="1.5"/>
    <path d="M52 38 C58 48 56 60 46 64 C34 68 22 58 18 46 C30 44 42 40 52 38Z" fill="url(#lotusFill)" stroke="url(#gold)" stroke-width="1.5"/>
  </g>
</svg>
